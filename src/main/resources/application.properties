spring.application.name=IpoPrediction
server.port=${PORT:8081}
app.environment=${APP_ENV:${SPRING_PROFILES_ACTIVE:dev}}
openai.api.key=${OPENAI_API_KEY}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.model=${OPENAI_MODEL:gpt-6-luna}
llm.system-prompt=${LLM_SYSTEM_PROMPT:You are an assistant that answers questions using the provided IPO context.}
openai.embedding.model=text-embedding-3-small
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.embedding.model=nomic-embed-text
chroma.url=${CHROMA_URL:http://localhost:8000}
chroma.tenant=${CHROMA_TENANT:default_tenant}
chroma.database=${CHROMA_DATABASE:default_database}
chroma.collection=${CHROMA_COLLECTION:ipo-documents}
ingest.allowed-hosts=${INGEST_ALLOWED_HOSTS:}
vector.store=pgvector
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
